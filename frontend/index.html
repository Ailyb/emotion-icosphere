<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Icosphere - Real-Time Emotion Visualization</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      pointer-events: none;
      z-index: 10;
    }
    .ui-card {
      pointer-events: auto;
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #ffffff;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 14px;
      color: #b0b0c0;
      line-height: 1.5;
    }
    .prompt-box {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      max-width: 90vw;
      pointer-events: auto;
    }
    .prompt-input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 20px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 16px;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .prompt-input:focus {
      border-color: #4a90e2;
    }
    .status {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(20, 20, 30, 0.8);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .status.connected { color: #4ade80; }
    .status.disconnected { color: #f87171; }
    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .emotion-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      color: #d7d7e0;
      font-size: 12px;
      font-weight: 600;
    }
    .contrast-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #b0b0c0;
      font-weight: 400;
      cursor: pointer;
    }
    .contrast-control input {
      accent-color: #69e6c1;
      width: 14px;
      height: 14px;
      margin: 0;
    }
    .emotion-item {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .emotion-bar {
      height: 6px;
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .emotion-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      width: 0%;
      transition: width 0.1s ease;
    }
    .response-panel {
      display: none;
      max-height: 112px;
      overflow: auto;
      margin-bottom: 8px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(15, 17, 24, 0.86);
      backdrop-filter: blur(8px);
      color: #e8e9ed;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .response-panel.visible { display: block; }
    .response-meta {
      margin-bottom: 3px;
      color: #8dceb9;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .response-panel.error .response-meta { color: #ff9a8f; }
    @media (max-width: 640px) {
      #ui-overlay { top: 12px; left: 12px; right: 12px; }
      .ui-card { padding: 14px; }
      .emotion-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .prompt-box { bottom: 18px; width: calc(100vw - 24px); max-width: 600px; }
      .status { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="ui-card">
      <h1>🧠 Emotion Icosphere</h1>
      <p>
        Watch a local open-weight LLM's internal emotion directions fire across
        an icosphere in real time. Each colored region represents emotion
        activation detected in the residual stream at layer 18.
      </p>
      <div class="emotion-toolbar">
        <span>Emotion signal</span>
        <label class="contrast-control" for="contrast-toggle">
          <input type="checkbox" id="contrast-toggle" />
          Auto contrast
        </label>
      </div>
      <div class="emotion-grid" id="emotion-grid"></div>
    </div>
  </div>

  <div class="prompt-box">
    <div class="response-panel" id="response-panel" aria-live="polite">
      <div class="response-meta" id="response-meta">Generating</div>
      <div id="generated-response"></div>
    </div>
    <input
      type="text"
      id="prompt-input"
      class="prompt-input"
      placeholder="Type a prompt and press Enter to watch emotions fire..."
      autocomplete="off"
    />
  </div>

  <div class="status disconnected" id="status">Disconnected</div>

  <!-- Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

  <script>
    // ========== Configuration ==========
    const CONFIG = {
      wsUrl: 'ws://127.0.0.1:8000/ws',
      nsub: 7,
      radius: 2,
      cellCount: 1280, // icosphere nsub=3 cell count
      decayRate: 0.92,
      baselineRate: 0.06,
      baselineFloor: 0.08,
      contrastNoiseFloor: 0.025,
      contrastRange: 1.8,
      emotionNames: [
        'joy', 'sadness', 'fear', 'anger',
        'surprise', 'disgust', 'calm', 'love'
      ],
      emotionColors: {
        joy: 0xFFD700,
        sadness: 0x4A90E2,
        fear: 0x9B59B6,
        anger: 0xE74C3C,
        surprise: 0xF39C12,
        disgust: 0x27AE60,
        calm: 0x1ABC9C,
        love: 0xFF69B4
      }
    };

    // ========== State ==========
    let scene, camera, renderer, icosahedron, sphereMesh;
    let ws;
    let currentIntensities = new Float32Array(CONFIG.cellCount).fill(0);
    let targetIntensities = new Float32Array(CONFIG.cellCount).fill(0);
    let lastFacetIntensities = new Float32Array(CONFIG.cellCount).fill(0);
    let emotionBars = {};
    let isConnected = false;
    let isGenerating = false;
    let useAutoContrast = false;
    let lastEmotionScores = {};
    let facetEmotionByIndex = new Array(CONFIG.cellCount).fill(null);
    let emotionBaselines = Object.fromEntries(
      CONFIG.emotionNames.map(emotion => [emotion, CONFIG.baselineFloor])
    );

    // ========== Three.js Setup ==========
    function initThree() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05050a);
      scene.fog = new THREE.Fog(0x05050a, 10, 50);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 6);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Ambient light
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambientLight);

      // Point light for bloom-like effect
      const pointLight = new THREE.PointLight(0xffffff, 1);
      pointLight.position.set(5, 5, 5);
      scene.add(pointLight);

      // Create icosphere geometry
      const geometry = new THREE.IcosahedronGeometry(CONFIG.radius, CONFIG.nsub);

      // Create buffer for per-cell colors
      const positions = geometry.attributes.position;
      const colors = new Float32Array(positions.count * 3);
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Material with vertex colors
      const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.4,
        metalness: 0.1,
        flatShading: true
      });

      sphereMesh = new THREE.Mesh(geometry, material);
      scene.add(sphereMesh);

      CONFIG.emotionNames.forEach(emotion => {
        emotionColors[emotion] = new THREE.Color(CONFIG.emotionColors[emotion]);
      });

      // Add wireframe overlay
      const wireframeGeo = new THREE.WireframeGeometry(geometry);
      const wireframeMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
      const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
      sphereMesh.add(wireframe);

      // Handle resize
      window.addEventListener('resize', onWindowResize);
    }

    const emotionColors = {};

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ========== Emotion Grid UI ==========
    function initEmotionGrid() {
      const grid = document.getElementById('emotion-grid');
      CONFIG.emotionNames.forEach((emotion, idx) => {
        const item = document.createElement('div');
        item.className = 'emotion-item';
        item.innerHTML = `
          <span style="font-weight:600">${emotion.charAt(0).toUpperCase() + emotion.slice(1)}</span>
          <div class="emotion-bar">
            <div class="emotion-fill" id="fill-${emotion}" style="background: #${CONFIG.emotionColors[emotion].toString(16).padStart(6,'0')}"></div>
          </div>
        `;
        grid.appendChild(item);
        emotionBars[emotion] = document.getElementById(`fill-${emotion}`);
      });
    }

    function updateEmotionScores(scores) {
      lastEmotionScores = scores;
      CONFIG.emotionNames.forEach(emotion => {
        const score = Math.max(0, Number(scores[emotion]) || 0);
        emotionBaselines[emotion] += (score - emotionBaselines[emotion]) * CONFIG.baselineRate;
      });
      updateEmotionBars();
      updateFacetTargets();
    }

    function updateEmotionBars() {
      CONFIG.emotionNames.forEach(emotion => {
        const score = Math.max(0, Number(lastEmotionScores[emotion]) || 0);
        const displayValue = getDisplayIntensity(score, emotion);
        const bar = emotionBars[emotion];
        if (bar) {
          bar.style.width = `${displayValue * 100}%`;
        }
      });
    }

    function getDisplayIntensity(rawValue, emotion) {
      const value = Math.max(0, Number(rawValue) || 0);
      if (!useAutoContrast) return Math.min(1, value);
      if (value <= CONFIG.contrastNoiseFloor) return 0;
      const baseline = Math.max(emotionBaselines[emotion] || 0, CONFIG.baselineFloor);
      const normalized = value / (baseline * CONFIG.contrastRange);
      return Number.isFinite(normalized) ? Math.max(0, Math.min(1, normalized)) : 0;
    }

    function updateFacetTargets() {
      targetIntensities = Float32Array.from(lastFacetIntensities, (rawValue, facetIndex) => {
        const emotion = facetEmotionByIndex[facetIndex];
        return emotion ? getDisplayIntensity(rawValue, emotion) : 0;
      });
    }

    async function loadFacetMapping() {
      try {
        const response = await fetch('http://127.0.0.1:8000/facet_mapping');
        if (!response.ok) throw new Error(`Mapping request failed: ${response.status}`);
        const data = await response.json();
        let assignments = data.facet_assignments;
        if (!assignments || !Object.keys(assignments).length) {
          const localResponse = await fetch('../data/emotion_vectors/facet_mapping.json');
          if (!localResponse.ok) throw new Error(`Local mapping request failed: ${localResponse.status}`);
          const localData = await localResponse.json();
          assignments = localData.facet_mapping;
        }
        Object.entries(assignments || {}).forEach(([emotion, indices]) => {
          if (!CONFIG.emotionColors[emotion] || !Array.isArray(indices)) return;
          indices.forEach(index => {
            if (Number.isInteger(index) && index >= 0 && index < CONFIG.cellCount) {
              facetEmotionByIndex[index] = emotion;
            }
          });
        });
        updateFacetTargets();
      } catch (error) {
        console.error('Unable to load emotion facet assignments:', error);
      }
    }

    // ========== Icosphere Update ==========
    function updateIcosphere(intensities) {
      if (!sphereMesh) return;

      const geometry = sphereMesh.geometry;
      const colors = geometry.attributes.color;

      // Map intensities to colors
      // Each cell (triangle) gets a color based on its intensity
      // We color the vertices - simpler approach: color each vertex by average cell intensity
      
      const colorArray = colors.array;

      for (let vertexIndex = 0; vertexIndex < colors.count; vertexIndex++) {
        const facetIndex = Math.floor(vertexIndex / 3);
        const emotion = facetEmotionByIndex[facetIndex];
        const color = emotionColors[emotion];
        const intensity = intensities[facetIndex] || 0;
        const brightness = intensity > 0
          ? 0.08 + intensity * 1.2
          : 0.025;

        if (color) {
          colorArray[vertexIndex * 3] = Math.min(1, color.r * brightness);
          colorArray[vertexIndex * 3 + 1] = Math.min(1, color.g * brightness);
          colorArray[vertexIndex * 3 + 2] = Math.min(1, color.b * brightness);
        } else {
          colorArray[vertexIndex * 3] = 0.012;
          colorArray[vertexIndex * 3 + 1] = 0.016;
          colorArray[vertexIndex * 3 + 2] = 0.025;
        }
      }

      colors.needsUpdate = true;
    }

    // ========== WebSocket ==========
    function connectWebSocket() {
      ws = new WebSocket(CONFIG.wsUrl);

      ws.onopen = () => {
        isConnected = true;
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
        console.log('WebSocket connected');
      };

      ws.onclose = () => {
        isConnected = false;
        document.getElementById('status').textContent = 'Disconnected';
        document.getElementById('status').className = 'status disconnected';
        if (isGenerating) finishResponse('Connection lost before generation completed.', true);
        console.log('WebSocket disconnected');
        // Reconnect after delay
        setTimeout(connectWebSocket, 2000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.event === 'complete') {
            finishResponse('Complete');
            return;
          }
          if (data.event === 'error') {
            finishResponse(data.message || 'Generation failed.', true);
            return;
          }

          if (data.token) {
            document.getElementById('generated-response').textContent += data.token;
          }
          
          // Update emotion scores UI
          if (data.emotion_scores) {
            updateEmotionScores(data.emotion_scores);
          }

          // Update facet intensities
          if (data.facet_intensities) {
            lastFacetIntensities = new Float32Array(data.facet_intensities);
            updateFacetTargets();
          }

        } catch (e) {
          console.error('Error parsing WebSocket message:', e);
        }
      };
    }

    // ========== Animation Loop ==========
    function animate() {
      requestAnimationFrame(animate);

      // Apply decay to current intensities toward target
      for (let i = 0; i < CONFIG.cellCount; i++) {
        currentIntensities[i] = currentIntensities[i] * CONFIG.decayRate + 
                                targetIntensities[i] * (1 - CONFIG.decayRate);
      }

      // Update sphere colors
      updateIcosphere(currentIntensities);

      // Rotate sphere slowly
      if (sphereMesh) {
        sphereMesh.rotation.y += 0.005;
        sphereMesh.rotation.x += 0.002;
      }

      renderer.render(scene, camera);
    }

    // ========== Input Handling ==========
    const input = document.getElementById('prompt-input');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && isConnected && !isGenerating) {
        const prompt = input.value.trim();
        if (prompt) {
          sendPrompt(prompt);
          input.value = '';
        }
      }
    });

    function sendPrompt(prompt) {
      if (!isConnected || isGenerating) return;
      isGenerating = true;
      input.disabled = true;
      const responsePanel = document.getElementById('response-panel');
      responsePanel.classList.add('visible');
      responsePanel.classList.remove('error');
      document.getElementById('response-meta').textContent = 'Generating';
      document.getElementById('generated-response').textContent = '';
      const message = {
        prompt: prompt,
        max_tokens: 30,
        temperature: 0.7,
        stream: true
      };
      ws.send(JSON.stringify(message));
      console.log('Sent:', prompt);
    }

    function finishResponse(message, isError = false) {
      isGenerating = false;
      input.disabled = false;
      document.getElementById('response-meta').textContent = isError ? 'Error' : message;
      document.getElementById('response-panel').classList.toggle('error', isError);
      if (isError) {
        const response = document.getElementById('generated-response');
        response.textContent = response.textContent
          ? `${response.textContent}\n${message}`
          : message;
      }
    }

    document.getElementById('contrast-toggle').addEventListener('change', event => {
      useAutoContrast = event.target.checked;
      if (Object.keys(lastEmotionScores).length) updateEmotionBars();
      updateFacetTargets();
    });

    // ========== Initialize ==========
    function init() {
      initThree();
      initEmotionGrid();
      loadFacetMapping();
      connectWebSocket();
      animate();
    }

    init();
  </script>
</body>
</html>
